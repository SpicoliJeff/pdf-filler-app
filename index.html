<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover, user-scalable=no"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>

<meta name="mobile-web-app-capable" content="yes"/>
<meta name="theme-color" content="#0f1115"/>

<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%20180%20180%22%3E%3Crect%20width%3D%22180%22%20height%3D%22180%22%20rx%3D%2236%22%20fill%3D%22%231a73e8%22%2F%3E%3Crect%20x%3D%2240%22%20y%3D%2230%22%20width%3D%22100%22%20height%3D%22120%22%20rx%3D%228%22%20fill%3D%22%23fff%22%2F%3E%3Cpath%20d%3D%22M55%2070h70M55%2090h70M55%20110h50%22%20stroke%3D%22%231a73e8%22%20stroke-width%3D%228%22%20stroke-linecap%3D%22round%22%2F%3E%3Ccircle%20cx%3D%22130%22%20cy%3D%22130%22%20r%3D%2228%22%20fill%3D%22%2334a853%22%2F%3E%3Cpath%20d%3D%22M118%20130l8%208%2016-16%22%20stroke%3D%22%23fff%22%20stroke-width%3D%226%22%20fill%3D%22none%22%20stroke-linecap%3D%22round%22%20stroke-linejoin%3D%22round%22%2F%3E%3C%2Fsvg%3E"/>
<title>PDF Fill</title>
<link rel="stylesheet" href="app.css"/>
</head>
<body>
<div id="app">
  <header id="toolbar">
    <div class="row primary">
      <label class="btn primary" id="openBtn">
        Open PDF
        <input type="file" id="fileInput" accept="application/pdf" hidden/>
      </label>
      <button type="button" class="btn" id="undoBtn" disabled>Undo</button>
      <button type="button" class="btn" id="checkBtn" aria-pressed="false" title="Checkmark mode">✓</button>
      <button type="button" class="btn primary" id="saveBtn" disabled>Save PDF</button>
    </div>
    <div class="row secondary" id="sizeRow">
      <span class="label">Size</span>
      <button type="button" class="btn size" data-size="S">Small</button>
      <button type="button" class="btn size active" data-size="M">Medium</button>
      <button type="button" class="btn size" data-size="L">Large</button>
    </div>
    <div id="status" class="status" hidden></div>
  </header>
  <div id="hint" class="hint" hidden>Tap where you want to write</div>
  <main id="pages" class="pages empty">
    <div class="welcome">
      <div class="welcome-icon">📄</div>
      <h1>PDF Fill</h1>
      <p>Open a scanned form, tap where you want to write, then Save PDF.</p>
      <label class="btn primary big" for="fileInput">Open PDF</label>
    </div>
  </main>
</div>
<script src="https://cdn.jsdelivr.net/npm/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
<script type="module" src="app.js"></script>
</body>
</html>
