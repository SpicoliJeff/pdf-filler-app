<!DOCTYPE html><html><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><title>PDF Fill</title></head><body>
<p id="s">Loading…</p>
<script>
(async()=>{
  const n=4; let t='';
  for(let i=0;i<n;i++){const r=await fetch('p'+i+'.txt'); if(!r.ok) throw new Error(i); t+=await r.text();}
  document.open(); document.write(t); document.close();
})().catch(e=>document.getElementById('s').textContent='Fail '+e);
</script></body></html>
